name: CI

on:
  push:
    branches:
      - main
  pull_request:
  repository_dispatch:
    types:
      - araihu-assets-released

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: go install github.com/a-h/templ/cmd/templ@v0.3.1020
      - name: Verify generated templ output is current
        run: templ generate && git diff --exit-code -- 'site/*_templ.go'
      - name: Verify source contracts without protected Assets credentials
        run: go test ./... -count=1 && npm run test:workflow && npm run test:routes

  accepted-assets:
    needs: source
    if: github.event_name == 'repository_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: assets-token
        with:
          app-id: ${{ secrets.ASSETS_APP_ID }}
          private-key: ${{ secrets.ASSETS_APP_PRIVATE_KEY }}
          owner: araihu
          repositories: assets
          permission-actions: read
          permission-contents: read
      - run: npm ci
      - run: go install github.com/a-h/templ/cmd/templ@v0.3.1020
      - name: Materialize accepted immutable Assets bundle from promotion dispatch
        if: github.event_name == 'repository_dispatch'
        env:
          ASSETS_GITHUB_TOKEN: ${{ steps.assets-token.outputs.token }}
          DISPATCH_EVENT_TYPE: ${{ github.event.action }}
          ASSETS_HANDOFF_JSON: ${{ toJSON(github.event.client_payload) }}
          ACCEPTED_ASSETS: ${{ runner.temp }}/accepted-assets.json
          ASSET_BUNDLE: ${{ runner.temp }}/asset-bundle
        run: |
          test "$DISPATCH_EVENT_TYPE" = araihu-assets-released
          python3 scripts/prepare_asset_bundle.py \
            --handoff-json "$ASSETS_HANDOFF_JSON" \
            --accepted-output "$ACCEPTED_ASSETS" \
            --output "$ASSET_BUNDLE"
      - name: Materialize accepted immutable Assets bundle from main promotion variables
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ASSETS_GITHUB_TOKEN: ${{ steps.assets-token.outputs.token }}
          ASSETS_HANDOFF_JSON: ${{ vars.ASSETS_RELEASE_HANDOFF_JSON }}
          ACCEPTED_ASSETS: ${{ runner.temp }}/accepted-assets.json
          ASSET_BUNDLE: ${{ runner.temp }}/asset-bundle
        run: |
          python3 scripts/prepare_asset_bundle.py \
            --handoff-json "$ASSETS_HANDOFF_JSON" \
            --accepted-output "$ACCEPTED_ASSETS" \
            --output "$ASSET_BUNDLE"
      - name: Verify complete assembled Worker version
        env:
          ASSET_BUNDLE: ${{ runner.temp }}/asset-bundle
        run: npm run check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accepted-assets
          path: ${{ runner.temp }}/accepted-assets.json
          if-no-files-found: error
          retention-days: 1
