name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
      - run: go install github.com/a-h/templ/cmd/templ@v0.3.1020
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify generated templ output is current
        run: templ generate && git diff --exit-code -- 'site/*_templ.go'
      - name: Verify static site and undeployed Worker bundle
        run: npm run check
