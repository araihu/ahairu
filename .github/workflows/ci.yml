name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out reviewed Goshtoso compatibility source
        uses: actions/checkout@v4
        with:
          repository: araihu/goshtoso
          ref: 91e7225452aa74243a3840412b9d00c91e8cac87
          path: .ci/goshtoso
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
      - run: go install github.com/a-h/templ/cmd/templ@v0.3.1020
      - name: Create temporary compatibility workspace
        run: cd "$RUNNER_TEMP" && go work init "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci/goshtoso"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify generated templ output is current
        env:
          GOWORK: ${{ runner.temp }}/go.work
        run: templ generate && git diff --exit-code -- 'site/*_templ.go'
      - name: Verify static site and undeployed Worker bundle
        env:
          GOWORK: ${{ runner.temp }}/go.work
        run: npm run check
