name: CI

on:
  push:
    branches:
      - main
  pull_request:
  repository_dispatch:
    types:
      - assets-release-promoted

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: go install github.com/a-h/templ/cmd/templ@v0.3.1020
      - name: Verify generated templ output is current
        run: templ generate && git diff --exit-code -- 'site/*_templ.go'
      - name: Verify source contracts without protected Assets credentials
        run: go test ./... -count=1 && npm run test:routes

  accepted-assets:
    needs: source
    if: github.event_name == 'repository_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: assets-token
        with:
          app-id: ${{ secrets.ASSETS_APP_ID }}
          private-key: ${{ secrets.ASSETS_APP_PRIVATE_KEY }}
          owner: araihu
          repositories: assets
          permission-actions: read
      - run: npm ci
      - run: go install github.com/a-h/templ/cmd/templ@v0.3.1020
      - name: Materialize accepted immutable Assets bundle from promotion dispatch
        if: github.event_name == 'repository_dispatch'
        env:
          ASSETS_GITHUB_TOKEN: ${{ steps.assets-token.outputs.token }}
          ASSETS_RELEASE_URL: ${{ github.event.client_payload.assets_release_url }}
          ASSETS_RELEASE_ID: ${{ github.event.client_payload.assets_release_id }}
          ASSETS_RELEASE_SHA256: ${{ github.event.client_payload.assets_release_sha256 }}
          ASSETS_CHANNEL_URL: ${{ github.event.client_payload.assets_channel_url }}
          ASSETS_CHANNEL_ID: ${{ github.event.client_payload.assets_channel_id }}
          ASSETS_CHANNEL_SHA256: ${{ github.event.client_payload.assets_channel_sha256 }}
          ACCEPTED_ASSETS: ${{ runner.temp }}/accepted-assets.json
          ASSET_BUNDLE: ${{ runner.temp }}/asset-bundle
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const values = {
            releaseURL: process.env.ASSETS_RELEASE_URL,
            releaseID: process.env.ASSETS_RELEASE_ID,
            releaseSHA256: process.env.ASSETS_RELEASE_SHA256,
            channelURL: process.env.ASSETS_CHANNEL_URL,
            channelID: process.env.ASSETS_CHANNEL_ID,
            channelSHA256: process.env.ASSETS_CHANNEL_SHA256,
          };
          for (const [name, value] of Object.entries(values)) {
            if (!value || /[\r\n]/.test(value)) throw new Error(`missing or invalid dispatch payload ${name}`);
          }
          fs.writeFileSync(process.env.ACCEPTED_ASSETS, `${JSON.stringify(values)}\n`, { mode: 0o600 });
          NODE
          python3 scripts/prepare_asset_bundle.py \
            --release-url "$ASSETS_RELEASE_URL" --release-id "$ASSETS_RELEASE_ID" --release-sha256 "$ASSETS_RELEASE_SHA256" \
            --channel-url "$ASSETS_CHANNEL_URL" --channel-id "$ASSETS_CHANNEL_ID" --channel-sha256 "$ASSETS_CHANNEL_SHA256" \
            --output "$ASSET_BUNDLE"
      - name: Materialize accepted immutable Assets bundle from main promotion variables
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ASSETS_GITHUB_TOKEN: ${{ steps.assets-token.outputs.token }}
          ASSETS_RELEASE_URL: ${{ vars.ASSETS_RELEASE_URL }}
          ASSETS_RELEASE_ID: ${{ vars.ASSETS_RELEASE_ID }}
          ASSETS_RELEASE_SHA256: ${{ vars.ASSETS_RELEASE_SHA256 }}
          ASSETS_CHANNEL_URL: ${{ vars.ASSETS_CHANNEL_URL }}
          ASSETS_CHANNEL_ID: ${{ vars.ASSETS_CHANNEL_ID }}
          ASSETS_CHANNEL_SHA256: ${{ vars.ASSETS_CHANNEL_SHA256 }}
          ACCEPTED_ASSETS: ${{ runner.temp }}/accepted-assets.json
          ASSET_BUNDLE: ${{ runner.temp }}/asset-bundle
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const values = {
            releaseURL: process.env.ASSETS_RELEASE_URL,
            releaseID: process.env.ASSETS_RELEASE_ID,
            releaseSHA256: process.env.ASSETS_RELEASE_SHA256,
            channelURL: process.env.ASSETS_CHANNEL_URL,
            channelID: process.env.ASSETS_CHANNEL_ID,
            channelSHA256: process.env.ASSETS_CHANNEL_SHA256,
          };
          for (const [name, value] of Object.entries(values)) {
            if (!value || /[\r\n]/.test(value)) throw new Error(`missing or invalid main promotion variable ${name}`);
          }
          fs.writeFileSync(process.env.ACCEPTED_ASSETS, `${JSON.stringify(values)}\n`, { mode: 0o600 });
          NODE
          python3 scripts/prepare_asset_bundle.py \
            --release-url "$ASSETS_RELEASE_URL" --release-id "$ASSETS_RELEASE_ID" --release-sha256 "$ASSETS_RELEASE_SHA256" \
            --channel-url "$ASSETS_CHANNEL_URL" --channel-id "$ASSETS_CHANNEL_ID" --channel-sha256 "$ASSETS_CHANNEL_SHA256" \
            --output "$ASSET_BUNDLE"
      - name: Verify complete assembled Worker version
        env:
          ASSET_BUNDLE: ${{ runner.temp }}/asset-bundle
        run: npm run check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accepted-assets
          path: ${{ runner.temp }}/accepted-assets.json
          if-no-files-found: error
          retention-days: 1
