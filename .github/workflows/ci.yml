name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.actor &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps"]') ||
        'ubuntu-latest'
      }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install or verify exact Dagger CLI
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash .github/scripts/setup-dagger.sh
      - name: Verify source contracts with Dagger
        run: |
          dagger call source \
            --source=. \
            --run-nonce='${{ github.run_id }}-${{ github.run_attempt }}'
