name: Accepted assets

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - araihu-assets-released

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install or verify exact Dagger CLI
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash .github/scripts/setup-dagger.sh
      - name: Verify source contracts with Dagger
        run: |
          dagger call source \
            --source=. \
            --run-nonce='${{ github.run_id }}-${{ github.run_attempt }}'

  accepted-assets:
    needs: source
    timeout-minutes: 20
    # Only an Assets provider dispatch can promote; its Dagger handoff gate
    # rejects every release tag that is not canonical SemVer.
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install or verify exact Dagger CLI
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash .github/scripts/setup-dagger.sh
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: assets-token
        with:
          app-id: ${{ secrets.ASSETS_APP_ID }}
          private-key: ${{ secrets.ASSETS_APP_PRIVATE_KEY }}
          owner: araihu
          repositories: assets
          permission-actions: read
          permission-contents: read
      - name: Materialize dispatch Assets and verify complete Worker with Dagger
        env:
          ASSETS_GITHUB_TOKEN: ${{ steps.assets-token.outputs.token }}
          ASSETS_HANDOFF_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          dagger call accepted-assets-dispatch \
            --source=. \
            --handoff-json=env://ASSETS_HANDOFF_JSON \
            --assets-github-token=env://ASSETS_GITHUB_TOKEN \
            --run-nonce='${{ github.run_id }}-${{ github.run_attempt }}' \
            --dispatch-event-type='${{ github.event.action }}' \
            export --path='${{ runner.temp }}/accepted-assets.json'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: accepted-assets
          path: ${{ runner.temp }}/accepted-assets.json
          if-no-files-found: error
          retention-days: 1
