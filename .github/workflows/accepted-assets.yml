name: Accepted assets

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - araihu-assets-released

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: go install github.com/a-h/templ/cmd/templ@v0.3.1020
      - name: Verify generated templ output is current
        run: templ generate && git diff --exit-code -- 'site/*_templ.go'
      - name: Verify source contracts without protected Assets credentials
        run: go test ./... -count=1 && npm run test:workflow && npm run test:routes && npm run test:canary

  accepted-assets:
    needs: source
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.ref == 'refs/heads/main' && vars.ASSETS_RELEASE_HANDOFF_JSON != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: assets-token
        with:
          app-id: ${{ secrets.ASSETS_APP_ID }}
          private-key: ${{ secrets.ASSETS_APP_PRIVATE_KEY }}
          owner: araihu
          repositories: assets
          permission-actions: read
          permission-contents: read
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: go install github.com/a-h/templ/cmd/templ@v0.3.1020
      - name: Materialize accepted immutable Assets bundle from promotion dispatch
        if: github.event_name == 'repository_dispatch'
        env:
          ASSETS_GITHUB_TOKEN: ${{ steps.assets-token.outputs.token }}
          DISPATCH_EVENT_TYPE: ${{ github.event.action }}
          ASSETS_HANDOFF_JSON: ${{ toJSON(github.event.client_payload) }}
          ACCEPTED_ASSETS: ${{ runner.temp }}/accepted-assets.json
          ASSET_BUNDLE: ${{ runner.temp }}/asset-bundle
        run: |
          test "$DISPATCH_EVENT_TYPE" = araihu-assets-released
          python3 scripts/prepare_asset_bundle.py \
            --handoff-json "$ASSETS_HANDOFF_JSON" \
            --accepted-output "$ACCEPTED_ASSETS" \
            --output "$ASSET_BUNDLE"
      - name: Materialize accepted immutable Assets bundle from main promotion variables
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ASSETS_GITHUB_TOKEN: ${{ steps.assets-token.outputs.token }}
          ASSETS_HANDOFF_JSON: ${{ vars.ASSETS_RELEASE_HANDOFF_JSON }}
          ACCEPTED_ASSETS: ${{ runner.temp }}/accepted-assets.json
          ASSET_BUNDLE: ${{ runner.temp }}/asset-bundle
        run: |
          python3 scripts/prepare_asset_bundle.py \
            --handoff-json "$ASSETS_HANDOFF_JSON" \
            --accepted-output "$ACCEPTED_ASSETS" \
            --output "$ASSET_BUNDLE"
      - name: Verify complete assembled Worker version
        env:
          ASSET_BUNDLE: ${{ runner.temp }}/asset-bundle
        run: npm run check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: accepted-assets
          path: ${{ runner.temp }}/accepted-assets.json
          if-no-files-found: error
          retention-days: 1
