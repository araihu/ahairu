name: Deploy

on:
  workflow_run:
    workflows: [Accepted assets]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  cloudflare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'repository_dispatch'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: ahairu-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install or verify exact Dagger CLI
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash .github/scripts/setup-dagger.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: accepted-assets
          path: ${{ runner.temp }}/accepted-assets
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: assets-token
        with:
          app-id: ${{ secrets.ASSETS_APP_ID }}
          private-key: ${{ secrets.ASSETS_APP_PRIVATE_KEY }}
          owner: araihu
          repositories: assets
          permission-actions: read
          permission-contents: read
      - name: Reacquire, validate, and promote exact Worker with Dagger
        env:
          ASSETS_GITHUB_TOKEN: ${{ steps.assets-token.outputs.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          dagger call deploy \
            --source=. \
            --accepted-assets='${{ runner.temp }}/accepted-assets/accepted-assets.json' \
            --assets-github-token=env://ASSETS_GITHUB_TOKEN \
            --cloudflare-api-token=env://CLOUDFLARE_API_TOKEN \
            --cloudflare-account-id=env://CLOUDFLARE_ACCOUNT_ID \
            --run-nonce='${{ github.run_id }}-${{ github.run_attempt }}' \
            export --path='${{ runner.temp }}/deployed-version.txt'
      - name: Summarize verified production version
        run: |
          printf 'Deployed Worker version: %s\n' "$(tr -d '\n' < '${{ runner.temp }}/deployed-version.txt')" >> "$GITHUB_STEP_SUMMARY"
      - name: Mint post-promotion state token scoped to Ahairu
        id: state-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AHAIRU_APP_ID }}
          private-key: ${{ secrets.AHAIRU_APP_PRIVATE_KEY }}
          owner: araihu
          repositories: ahairu
          permission-contents: write
      - name: Durably accept verified deployed Assets channel with Dagger
        env:
          AHAIRU_GITHUB_TOKEN: ${{ steps.state-token.outputs.token }}
        run: |
          dagger call accept-deployed-assets-state \
            --source=. \
            --accepted-assets='${{ runner.temp }}/accepted-assets/accepted-assets.json' \
            --ahairu-github-token=env://AHAIRU_GITHUB_TOKEN \
            --state-base-sha='${{ github.event.workflow_run.head_sha }}' \
            --run-nonce='${{ github.run_id }}-${{ github.run_attempt }}'
